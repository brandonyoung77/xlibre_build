services:
  xserver-build:
    build:
      context: .
      args:
        XLIBRE_VERSION: 25.1.8
        MESON_OPTIONS: ${MESON_OPTIONS}
      dockerfile: Dockerfile.xserver
      target: output
    container_name: xserver-build
    restart: "no"
    volumes:
      # Named volume shared with future driver containers
      - xlibre-deb-repo:/package-dist
      # Local host folder mount
      - ./output:/package-dist-host
    # FIX: Copy explicitly out of the immutable /tmp/artifacts stash into the mounts
    command: >
      sh -c "
      mkdir -p /package-dist /package-dist-host &&
      cp -a /tmp/artifacts/* /package-dist/ 2>/dev/null || true &&
      cp -a /tmp/artifacts/* /package-dist-host/ 2>/dev/null || true &&
      echo 'Successfully exported packages to host and shared named volume!' &&
      ls -lh /package-dist-host
      "

 # Service 2: Example XLibre Video Driver Builder (e.g., Intel/AMD/Dummy)
  xlibre-video-driver-build:
    build:
      context: .
      args:
        AMDGPU_VERSION: 25.1.1
      dockerfile: Dockerfile.amdgpu-driver
    container_name: xlibre-video-driver-build
    restart: "no"
    volumes:
      # Mount the SAME named volume! It appears inside this container automatically
      - xlibre-deb-repo:/incoming-debs:ro
      # Optional: export finished driver package back to your host machine
      - ./output/drivers:/driver-output
    depends_on:
      xserver-build:
        # Crucial: This ensures the driver build ONLY starts AFTER the server build successfully completes and exits
        condition: service_completed_successfully

  # Service 3: The Libinput Driver Builder
  xlibre-libinput-driver-build:
    build:
      context: .
      dockerfile: Dockerfile.input-driver
      args:
        # Separate version tracking specifically for the input layer
        LIBINPUT_DRV_VERSION: 25.0.1
    container_name: xlibre-libinput-driver-build
    restart: "no"
    volumes:
      # Mount the shared server debs repository as Read-Only
      - xlibre-deb-repo:/incoming-debs:ro
      # Drop the finished driver into a separate host directory for tracking cleanliness
      - ./output/drivers:/driver-output
    depends_on:
      xserver-build:
        condition: service_completed_successfully


volumes:
  xlibre-deb-repo:

